<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
  <!-- Mast -->
  <line x1="9" y1="5" x2="9" y2="15.5" stroke="#B39460" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Base legs -->
  <line x1="9" y1="15.5" x2="5.5" y2="17" stroke="#B39460" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="9" y1="15.5" x2="12.5" y2="17" stroke="#B39460" stroke-width="1.3" stroke-linecap="round"/>
  <!-- Signal arcs (3 = strong signal) -->
  <path d="M5.8 8.5 A4.5 4.5 0 0 1 12.2 8.5" stroke="#B39460" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <path d="M3.5 5.5 A7.5 7.5 0 0 1 14.5 5.5" stroke="#B39460" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Top dot (broadcast point) -->
  <circle cx="9" cy="4" r="1.2" fill="#B39460"/>
</svg>
