  <!-- Horizontal info lines inside tag body -->
  <line x1="8" y1="7" x2="14" y2="7" stroke="#788EA3" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="8" y1="9.5" x2="12.5" y2="9.5" stroke="#788EA3" stroke-width="1.1" stroke-linecap="round"/>
