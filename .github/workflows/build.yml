name: Valhalla Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valhalla-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Build and test Einherjar
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.92.0
        shell: pwsh
        run: |
          rustup toolchain install 1.92.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.92.0-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            agent\target
          key: ${{ runner.os }}-agent-cargo-${{ hashFiles('rust-toolchain.toml', 'agent/Cargo.toml', 'server/protocol/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-agent-cargo-

      - name: Test agent
        shell: pwsh
        run: cargo test --manifest-path Cargo.toml

      # ── Release build (stub.bin) ─────────────────────────────────────────
      # Production agent: no debug output.  Uses the default release profile.
      - name: Build agent (release)
        shell: pwsh
        run: |
          cargo build --release --manifest-path Cargo.toml --bin einherjar
          $exe = 'target\release\einherjar.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Release agent executable was not produced: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -le 0) {
            throw 'Release agent executable is empty.'
          }

      - name: Produce stub.bin
        shell: pwsh
        run: |
          # The compiled PE is the stub template.  Rename to .bin so the panel
          # treats it as a raw binary blob rather than an executable.
          $exe  = 'target\release\einherjar.exe'
          $stub = 'target\release\stub.bin'
          Copy-Item -LiteralPath $exe -Destination $stub -Force
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $stub).Path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'stub.bin MZ header check failed.'
          }
          Write-Host "stub.bin produced: $([System.IO.FileInfo]$stub | Select-Object -Expand Length) bytes"

      # ── Debug build (stub_debug.bin) ─────────────────────────────────────
      # Diagnostics-enabled agent: structured [DEBUG] logging to stderr.
      # Uses the release-debug profile (inherits release, strips=none) with the
      # debug-log Cargo feature.  Functionally identical to the release build;
      # only the logging output differs.
      - name: Build agent (debug-log)
        shell: pwsh
        run: |
          cargo build --profile release-debug --features debug-log --manifest-path Cargo.toml --bin einherjar
          $exe = 'target\release-debug\einherjar.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Debug agent executable was not produced: $exe"
          }
          if ((Get-Item -LiteralPath $exe).Length -le 0) {
            throw 'Debug agent executable is empty.'
          }

      - name: Produce stub_debug.bin
        shell: pwsh
        run: |
          $exe   = 'target\release-debug\einherjar.exe'
          $stub  = 'target\release-debug\stub_debug.bin'
          Copy-Item -LiteralPath $exe -Destination $stub -Force
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $stub).Path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'stub_debug.bin MZ header check failed.'
          }
          Write-Host "stub_debug.bin produced: $([System.IO.FileInfo]$stub | Select-Object -Expand Length) bytes"

      - name: Upload stub.bin
        uses: actions/upload-artifact@v4
        with:
          name: einherjar-stub
          path: agent/target/release/stub.bin
          if-no-files-found: error

      - name: Upload stub_debug.bin
        uses: actions/upload-artifact@v4
        with:
          name: einherjar-stub-debug
          path: agent/target/release-debug/stub_debug.bin
          if-no-files-found: error

      - name: Validate embedded configuration slot
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Search for the ASCII marker as text and validate the two NUL
          # terminators separately. This avoids PowerShell's byte-array
          # comparison/escaping pitfalls while still validating the raw PE
          # bytes at the matched offset.
          $markerText = 'VALHALLA-EINHERJAR-CFG-SLOT-V1'
          $markerBytes = [System.Text.Encoding]::ASCII.GetBytes($markerText)
          $markerLength = $markerBytes.Length
          $expectedCapacity = 4096 - 32 - 4

          function Assert-ConfigSlot([string]$path) {
            $resolved = (Resolve-Path -LiteralPath $path).Path
            $bytes = [System.IO.File]::ReadAllBytes($resolved)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)

            $searchFrom = 0
            while ($searchFrom -lt $text.Length) {
              $offset = $text.IndexOf($markerText, $searchFrom, [System.StringComparison]::Ordinal)
              if ($offset -lt 0) { break }

              # Rust's CONFIG_SLOT_MARKER is the 30-byte ASCII prefix followed
              # by two NUL bytes; verify those NUL bytes explicitly.
              $markerEnd = $offset + $markerLength
              if ($markerEnd + 2 + 4 -gt $bytes.Length) {
                $searchFrom = $offset + 1
                continue
              }
              if ($bytes[$markerEnd] -ne 0 -or $bytes[$markerEnd + 1] -ne 0) {
                $searchFrom = $offset + 1
                continue
              }

              $capacityOffset = $markerEnd + 2
              $capacity = [System.BitConverter]::ToUInt32($bytes, $capacityOffset)
              if ($capacity -ne $expectedCapacity) {
                $searchFrom = $offset + 1
                continue
              }

              $payload = $capacityOffset + 4
              if ($payload + $capacity -gt $bytes.Length) {
                $searchFrom = $offset + 1
                continue
              }

              # A clean template must have the complete payload region blank.
              $blank = $true
              for ($j = 0; $j -lt $capacity; $j++) {
                if ($bytes[$payload + $j] -ne 0) {
                  $blank = $false
                  break
                }
              }
              if (-not $blank) {
                $searchFrom = $offset + 1
                continue
              }

              Write-Host "${path}: dedicated configuration slot validated at 0x$('{0:X8}' -f $offset) ($capacity-byte blank payload)."
              return
            }

            throw "${path} does not contain a valid blank Einherjar configuration slot."
          }

          Assert-ConfigSlot 'target\release\stub.bin'
          Assert-ConfigSlot 'target\release-debug\stub_debug.bin'

  server:
    name: Build and test Valhalla Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install Rust 1.92.0
        shell: bash
        run: rustup toolchain install 1.92.0-x86_64-unknown-linux-gnu --profile minimal && rustup default 1.92.0-x86_64-unknown-linux-gnu

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: ${{ runner.os }}-server-cargo-${{ hashFiles('rust-toolchain.toml', 'server/Cargo.toml', 'server/protocol/Cargo.toml', 'server/tools/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-server-cargo-

      - name: Test server workspace
        shell: bash
        run: cargo test --manifest-path Cargo.toml --workspace

      - name: Check Python runtime services
        shell: bash
        run: python3 -m py_compile telemetry_service.py tools/command_client.py

      - name: Build server workspace
        shell: bash
        run: |
          cargo build --release --manifest-path Cargo.toml --workspace
          test -s target/release/valhalla-relay

      - name: Upload relay
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-relay-linux-x64
          path: server/target/release/valhalla-relay
          if-no-files-found: error

  panel:
    name: Build Valhalla Panel
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x86
          vs-version: '[17.0,18.0)'

      - name: Validate panel build inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project  = Join-Path $PWD 'panel\Valhalla.csproj'
          $manifest = Join-Path $PWD 'panel\build\dependency_manifest.json'
          $deps     = Join-Path $PWD 'panel\build\dependencies'
          foreach ($path in @($project, $manifest, $deps)) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Required panel build input is missing: $path" }
          }
          $required = @(Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json).required_files
          foreach ($entry in $required) {
            $path = Join-Path $deps $entry.filename
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing prepared DevExpress/runtime dependency: $($entry.filename)"
            }
          }
          Write-Host "Panel inputs validated: $($required.Count) runtime dependencies + map data."

      - name: Restore panel packages
        shell: pwsh
        run: msbuild panel\Valhalla.csproj /t:Restore /p:Configuration=Release /p:Platform=AnyCPU /m

      - name: Build panel
        shell: pwsh
        run: msbuild panel\Valhalla.csproj /t:Build /p:Configuration=Release /p:Platform=AnyCPU /m /v:minimal

      - name: Verify panel output
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'panel\bin\Release\Valhalla.exe'
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw "Panel executable was not produced: $output"
          }
          if ((Get-Item -LiteralPath $output).Length -le 0) {
            throw 'Panel executable is empty.'
          }

      - name: Upload Valhalla.exe
        uses: actions/upload-artifact@v4
        with:
          name: Valhalla.exe
          path: panel/bin/Release/Valhalla.exe
          if-no-files-found: error

      - name: Upload panel binaries
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-panel-binaries
          path: panel/bin/Release/*
          if-no-files-found: error

  panel-bundle:
    name: Bundle Valhalla Panel with stubs
    needs: [agent, panel]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download panel binaries
        uses: actions/download-artifact@v4
        with:
          name: valhalla-panel-binaries
          path: panel-artifact

      - name: Download stub.bin
        uses: actions/download-artifact@v4
        with:
          name: einherjar-stub
          path: stub-artifact

      - name: Download stub_debug.bin
        uses: actions/download-artifact@v4
        with:
          name: einherjar-stub-debug
          path: stub-debug-artifact

      - name: Validate stubs
        shell: pwsh
        run: |
          # Validate release stub
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path stub-artifact\stub.bin).Path)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'stub.bin MZ header check failed after download.'
          }
          Write-Host "stub.bin ready: $($bytes.Length) bytes"

          # Validate debug stub
          $dbytes = [System.IO.File]::ReadAllBytes((Resolve-Path stub-debug-artifact\stub_debug.bin).Path)
          if ($dbytes.Length -lt 2 -or $dbytes[0] -ne 0x4D -or $dbytes[1] -ne 0x5A) {
            throw 'stub_debug.bin MZ header check failed after download.'
          }
          Write-Host "stub_debug.bin ready: $($dbytes.Length) bytes"

          # Both stubs must be different (debug has debug-log feature; different size expected)
          if ($bytes.Length -eq $dbytes.Length) {
            Write-Warning "stub.bin and stub_debug.bin have identical sizes — verify debug-log feature is active in debug build."
          }

      - name: Embed stubs into panel output
        shell: pwsh
        run: |
          # Place both stubs at panel-artifact/stub/ so LocateStub() finds them
          # at depth 0 when the panel is run from that directory.
          $dest = Join-Path $PWD 'panel-artifact\stub'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Copy-Item -LiteralPath stub-artifact\stub.bin           -Destination "$dest\stub.bin"       -Force
          Copy-Item -LiteralPath stub-debug-artifact\stub_debug.bin -Destination "$dest\stub_debug.bin" -Force
          Write-Host "stub.bin embedded at       $dest\stub.bin"
          Write-Host "stub_debug.bin embedded at $dest\stub_debug.bin"

      - name: Upload panel bundle
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-panel-windows-x64
          path: panel-artifact/*
          if-no-files-found: error

  quality:
    name: Validate repository layout and branding
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate clean repository
        shell: bash
        run: |
          set -euo pipefail
          test -d agent
          test -d server
          test -d panel
          test -z "$(find . -type f \( -iname '*.markdown' -o -iname '*.rst' -o -iname '*.adoc' -o -iname '*.txt' \) -print -quit)"

          python3 - <<'PY2'
          from pathlib import Path
          tokens = [
              bytes.fromhex(value).decode()
              for value in (
                  '7a65726f7472616365',
                  '7a747365637572697479',
                  '7a74736563',
                  '7a65726f207472616365',
                  '6f6666696369616c',
                  '737465616c6572',
                  '7a7472616365',
                  '56414c48414c4c415f43495f534d4f4b45',
                  '56414c48414c4c415f544553545f5055424c49435f4950',
                  '73637265656e73686f74',
              )
          ]
          # .bin is treated as binary — skip text scanning for it.
          binary_suffixes = {'.png', '.jpg', '.jpeg', '.gif', '.bmp', '.ico',
                             '.dll', '.exe', '.pdb', '.bin'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if any(token.casefold() in path.name.casefold() for token in tokens):
                  raise SystemExit(f'legacy or removed artifact naming remains: {path}')
              if path.suffix.lower() in binary_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              lowered = text.casefold()
              for token in tokens:
                  if token.casefold() in lowered:
                      raise SystemExit(f'legacy branding or removed CI instrumentation remains: {path}')
          PY2

          test ! -d panel/scripts
          test ! -d panel/tests
          test ! -d panel/plugin-sdk
          test ! -f agent/src/legacy_net.rs
          test ! -f agent/plugin/hello.cpp
          test ! -f panel/valhalla_agent.py
          test ! -f panel/resources/cookies_60px.svg

          python3 - <<'PY2'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path('.')
          ET.parse(root / 'panel/Valhalla.csproj')
          resx = root / 'panel/src/Properties/Resources.resx'
          tree = ET.parse(resx)
          for data in tree.getroot().findall('data'):
              value = data.findtext('value', '')
              if ';' not in value or not value.startswith('..\\'):  continue
              rel = value.split(';', 1)[0].replace('\\', '/')
              target = (resx.parent / rel).resolve()
              assert target.is_file(), f'missing resource file: {target}'
          print('Repository layout and resource references validated.')
          PY2

  package:
    name: Package build artifacts
    needs: [agent, server, panel-bundle, quality]
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/server release/panel

          # Panel ships with stub/ already embedded inside the panel artifact
          # (placed there by the panel-bundle job).  Copy the whole panel
          # directory including the stub/ subdirectory.
          cp -a artifacts/valhalla-panel-windows-x64/. release/panel/

          # Also place both stubs at release/stub/ so LocateStub() finds them
          # when walking up from release/panel/ → release/ → stub/
          mkdir -p release/stub
          cp artifacts/einherjar-stub/stub.bin             release/stub/stub.bin
          cp artifacts/einherjar-stub-debug/stub_debug.bin release/stub/stub_debug.bin

          cp artifacts/valhalla-relay-linux-x64/valhalla-relay release/server/valhalla-relay

          tar -C release -czf valhalla-build-${GITHUB_SHA}.tgz server panel stub

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: valhalla-build-${{ github.sha }}
          path: valhalla-build-${{ github.sha }}.tgz
          if-no-files-found: error
