<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
  <!-- Monitor body -->
  <rect x="1.5" y="2.5" width="15" height="10.5" rx="1.5" stroke="#7EB8D4" stroke-width="1.4"/>
  <!-- Screen rows (the client table) -->
  <line x1="4" y1="6" x2="13" y2="6" stroke="#7EB8D4" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="4" y1="8.5" x2="11" y2="8.5" stroke="#7EB8D4" stroke-width="0.9" stroke-linecap="round"/>
  <line x1="4" y1="11" x2="12" y2="11" stroke="#7EB8D4" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Live status dot top-right -->
  <circle cx="13.5" cy="5" r="1.1" fill="#7EB8D4"/>
  <!-- Stand -->
  <line x1="9" y1="13" x2="9" y2="15.5" stroke="#7EB8D4" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6.5" y1="15.5" x2="11.5" y2="15.5" stroke="#7EB8D4" stroke-width="1.4" stroke-linecap="round"/>
</svg>
