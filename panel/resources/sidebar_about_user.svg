<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
  <!-- About Us: two people silhouettes (team/company icon) -->
  <!-- Left person: head -->
  <circle cx="6.5" cy="5.5" r="2.2" stroke="#9A9A9A" stroke-width="1.3" fill="none"/>
  <!-- Left person: body arc -->
  <path d="M2 15 C2 11.5 4 10 6.5 10 C9 10 11 11.5 11 15" stroke="#9A9A9A" stroke-width="1.3" stroke-linecap="round" fill="none"/>
  <!-- Right person: head (slightly offset, overlapping feel) -->
  <circle cx="12.5" cy="5" r="1.8" stroke="#9A9A9A" stroke-width="1.2" fill="none"/>
  <!-- Right person: partial body arc (behind left person) -->
  <path d="M10 14.5 C10 12 11.5 10.5 13 10.5 C15 10.5 16.5 12 16.5 14.5" stroke="#9A9A9A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
</svg>
