[workspace]
members = ["protocol"]
resolver = "3"

[package]
name = "valhalla_server"
version = "1.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[[bin]]
name = "valhalla-relay"
path = "src/main.rs"

[dependencies]
arti-client = { version = "0.46.0", default-features = false, features = ["tokio", "native-tls", "onion-service-service", "static-sqlite"] }
base64 = "0.22.1"
hmac = "0.12.1"
sha2 = "0.10.9"
sha3 = "0.10.9"
ed25519-dalek = "=2.2.0"
futures-util = "0.3.34"
getrandom = "=0.2.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2.2.0"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
zeroize = "1.8.2"
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
tor-cell = { version = "0.46.0", features = ["hs"] }
tor-hsservice = { version = "0.46.0", default-features = false }
tor-proto = { version = "0.46.0", default-features = false, features = ["hs-service", "tokio"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
valhalla_protocol = { path = "protocol" }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
