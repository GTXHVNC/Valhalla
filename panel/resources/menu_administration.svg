  <!-- Download arrow -->
  <line x1="9" y1="2" x2="9" y2="9.5" stroke="#7BAEC8" stroke-width="1.5" stroke-linecap="round"/>
  <polyline points="6,7.5 9,10.5 12,7.5" stroke="#7BAEC8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Device screen line -->
  <line x1="5" y1="13.5" x2="13" y2="13.5" stroke="#7BAEC8" stroke-width="1" stroke-linecap="round"/>
</svg>
